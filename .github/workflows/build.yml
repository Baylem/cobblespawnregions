# Builds both loader variants on every push/PR.
# Pushing a tag like v1.0.7 additionally cuts a draft GitHub Release
# containing the Fabric and NeoForge jars.

name: build

on:
  push:
    branches: [ main, multiloader ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # MC 1.21.1 targets Java 21. Do not bump this -- ModDevGradle and Loom
      # are both far better exercised on 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # This mod resolves EverlastingUtils from mavenLocal(). EverlastingUtils
      # lives in a separate repository and is not published to any remote
      # maven, so a clean runner has nothing to resolve and the build would
      # fail at dependency resolution. Build and install it first.
      #
      # The ref is pinned deliberately: cobblespawnregions/multiloader is only
      # known to work against everlastingutils/multiloader.
      - name: Checkout EverlastingUtils
        uses: actions/checkout@v4
        with:
          repository: Baylem/everlastingutils
          ref: multiloader
          path: everlastingutils

      - name: Publish EverlastingUtils to mavenLocal
        run: |
          chmod +x ./everlastingutils/gradlew
          ./everlastingutils/gradlew -p everlastingutils publishToMavenLocal --stacktrace

      # Tag v1.0.7 -> mod_version 1.0.7. Untagged builds use gradle.properties.
      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "MOD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x ./gradlew
          if [ -n "$MOD_VERSION" ]; then
            ./gradlew build collectJars -Pmod_version="$MOD_VERSION" --stacktrace
          else
            ./gradlew build collectJars --stacktrace
          fi

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/release/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: jars

      # One release per tag, carrying BOTH loader jars. collectJars mirrors
      # fabric/ and neoforge/ into build/release, the build job uploads them as
      # a single `jars` artifact, and this attaches all of them to one release.
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: "CobbleSpawnRegions ${{ github.ref_name }}"
          files: jars/*.jar
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
          body: |
            Built from one shared source tree. Both loader jars are attached to
            this release.

            | Loader | Jar |
            |---|---|
            | Fabric | `cobblespawnregions-fabric-<version>.jar` |
            | NeoForge | `cobblespawnregions-neoforge-<version>.jar` |

            Requires Minecraft 1.21.1 and Java 21.

      # Optional: publish to Modrinth and CurseForge in the same step.
      # Requires MODRINTH_TOKEN / CURSEFORGE_TOKEN repo secrets and the
      # project IDs filled in. Note both platforms have re-upload policies
      # separate from the licence -- see docs/PORTING-PLAN.md.
      #
      # - name: Publish to Modrinth + CurseForge
      #   uses: Kir-Antipov/mc-publish@v3.3
      #   with:
      #     modrinth-id: YOUR_MODRINTH_PROJECT_ID
      #     modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
      #     curseforge-id: YOUR_CURSEFORGE_PROJECT_ID
      #     curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
      #     files: jars/*.jar
      #     loaders: |
      #       fabric
      #       neoforge
      #     game-versions: 1.21.1
      #     version-type: release
      #     dependencies: |
      #       cobblemon(required)
      #       everlastingutils(required)
